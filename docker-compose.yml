version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://nextjs_user:nextjs_password@db:3306/nextjs_starter
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - JWT_SECRET=your-super-secret-jwt-key
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key
      - NEXT_PUBLIC_ROOT_DOMAIN=localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=nextjs_starter
      - MYSQL_USER=nextjs_user
      - MYSQL_PASSWORD=nextjs_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # (Optional) Redis for rate limiting if you want to use local redis instead of Upstash
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - '6379:6379'

volumes:
  mysql_data:
