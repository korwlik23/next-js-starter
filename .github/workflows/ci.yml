name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      
    - name: Run Type Check
      run: npx tsc --noEmit

    - name: Run Unit Tests
      run: npm test

    - name: Build Next.js
      run: npm run build
      env:
        DATABASE_URL: "mysql://root:@localhost:3306/nextjs_starter" # Dummy for build
        JWT_SECRET: "dummy_secret_for_ci_build_minimum_32_chars"
        JWT_ACCESS_EXPIRES: "15m"
        JWT_REFRESH_EXPIRES: "7d"
        NEXT_PUBLIC_APP_NAME: "Next.js Starter"
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
